name: clickstream

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: clickstream-kafka
    ports:
      # Listener EXTERNAL: for services started on the host (go run)
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # KRaft: one node is both broker and controller, no ZooKeeper
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL  - kafka:29092, for containers in the compose network
      # EXTERNAL  - localhost:9092, for the host
      # CONTROLLER - KRaft quorum traffic, not published
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: internal topics cannot have more than one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, a typo in a topic name must not create a new topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot job: creates topics and exits
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: clickstream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic ${KAFKA_TOPIC:-user-events}
        --partitions ${KAFKA_TOPIC_PARTITIONS:-3}
        --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic ${KAFKA_TOPIC:-user-events}
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: clickstream-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"

  postgres:
    image: postgres:17-alpine
    container_name: clickstream-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies new migrations from ./migrations and exits.
  # Applied versions are tracked in the goose_db_version table.
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.26.0
    container_name: clickstream-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # up by default; e.g. GOOSE_COMMAND=status or GOOSE_COMMAND=down
      GOOSE_COMMAND: ${GOOSE_COMMAND:-up}
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"

  # Demo page and reverse proxy: /events goes to tracker-api, so the page
  # and the API share one origin. Page: http://localhost:3000
  frontend:
    image: nginx:1.28.0-alpine
    container_name: clickstream-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # tracker-api started on the host with go run; in compose: http://tracker-api:8080
      TRACKER_API_URL: ${TRACKER_API_URL:-http://host.docker.internal:8080}
    extra_hosts:
      # Docker Desktop resolves host.docker.internal itself, Linux needs this line
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  kafka-data:
  postgres-data:
