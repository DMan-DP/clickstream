# Kafka in KRaft mode: one node is both broker and controller, as in
# compose. Clients connect to kafka:9092.
---
# Headless Service for the broker itself: gives the pod a stable DNS name,
# kafka-0.kafka-headless.clickstream.svc.cluster.local, which the broker
# advertises to clients and uses as the controller quorum address.
# publishNotReadyAddresses: the name must resolve before the pod is ready,
# because the controller connects to its own quorum address while starting.
# Without it the pod waits for a DNS record that appears only after it is
# ready, and never becomes ready.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
---
# Bootstrap Service for clients: the first connection goes here, then the
# client gets the broker addresses from the metadata and connects to them
# directly. Only ready pods are behind it, so a client that starts before
# Kafka gets a refused connection at once.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka-headless
  # Must stay 1: KAFKA_NODE_ID and the quorum voters below are written for
  # one node. A second replica would start with the same node id. More
  # brokers need the id from the pod index and a voter list of all pods.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Kubernetes adds env vars for every Service in the namespace, for
      # the Service "kafka" these are KAFKA_PORT, KAFKA_SERVICE_HOST and so
      # on. The image turns every KAFKA_* variable into a broker setting,
      # so they would end up in the config as garbage.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@$(POD_NAME).kafka-headless.$(POD_NAMESPACE).svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # One listener for clients inside the cluster. No listener for
            # the host: a client outside the cluster would be redirected to
            # the advertised in-cluster name and could not resolve it.
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            # The address the broker returns to clients in the metadata.
            # It must be the name of this pod, not of the bootstrap Service:
            # with several brokers each one must be reachable by its own name.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://$(POD_NAME).kafka-headless.$(POD_NAMESPACE).svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            # Single broker: internal topics cannot have more than one replica
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created by the Job below, a typo in a topic name
            # must not create a new topic
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # A subdirectory of the volume: Kafka treats every directory in
            # the log dir as a partition and fails on lost+found
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/logs
            # The image starts the JVM with a 1 GB heap by default, too much
            # for a 4 GB node shared with everything else
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # The broker port starts accepting connections at the end of the
          # broker startup, so an open port means the broker can serve.
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # No livenessProbe, as with Postgres: if the JVM exits, the
          # container exits and is restarted anyway. A TCP check would only
          # see an open port, and a real broker health check needs the Kafka
          # tools, which start a JVM of their own on every probe.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
# One-shot job: creates the topic, as kafka-init in compose. If Kafka is
# not ready yet, the pod fails and the Job retries it with a growing pause
# (10 s, 20 s, 40 s and so on), up to backoffLimit times. --if-not-exists
# makes a rerun harmless.
# The pod template of a Job cannot be changed after creation: to change the
# topic or the partitions, run kubectl -n clickstream delete job kafka-topics
# first, then apply again. The topic name must match KAFKA_TOPIC of the
# services, the default in compose is user-events.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: kafka-topics
          image: apache/kafka:4.1.0
          command:
            - /bin/sh
            - -c
            - >
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
              --create --if-not-exists
              --topic user-events
              --partitions 3
              --replication-factor 1
              && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
              --describe --topic user-events
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xmx256m
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
