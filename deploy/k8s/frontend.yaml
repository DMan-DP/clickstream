# frontend: nginx with the page, /events is proxied to the tracker-api
# Service, so the browser talks to one origin and needs no CORS.
# From the host: kubectl -n clickstream port-forward svc/frontend 3000:80
# then open http://localhost:3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  # Static files and a proxy, no state: one replica is enough for the demo
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: clickstream/frontend:dev
          # Loaded with minikube image load, there is no registry
          imagePullPolicy: IfNotPresent
          # nginx resolves tracker-api once at start and exits if the name
          # is unknown. The Service has a stable ClusterIP, so resolving
          # once is fine; if it does not exist yet, the pod restarts until
          # it does (no depends_on in Kubernetes).
          env:
            - name: TRACKER_API_URL
              value: http://tracker-api:8080
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
