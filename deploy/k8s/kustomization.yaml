# Everything for minikube in one command:
#   kubectl apply -k deploy/k8s
#   kubectl delete -k deploy/k8s
# Before the first apply:
#   cp deploy/k8s/postgres.secret.env.example deploy/k8s/postgres.secret.env
#
# delete -k removes the namespace together with the volumes, and the
# minikube storage class deletes the data with them (reclaim policy Delete).
# Unlike docker compose down, the Postgres and Kafka data are gone. To stop
# and keep the data: minikube stop, or
#   kubectl -n clickstream scale statefulset --all --replicas=0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources go to this namespace, the manifests do not set their own
namespace: clickstream

labels:
  # On the resources and on the pods they create (includeTemplates), so
  # kubectl get pods -l app.kubernetes.io/part-of=clickstream finds them.
  # Not in selectors: selectors of existing workloads are immutable.
  # includeTemplates also labels the volumeClaimTemplates of the
  # StatefulSets, which are immutable too. Changing these labels later
  # fails with "field is immutable" until the StatefulSets are recreated:
  #   kubectl -n clickstream delete statefulset postgres kafka --cascade=orphan
  # then apply again (pods restart, volumes and data stay).
  - pairs:
      app.kubernetes.io/part-of: clickstream
    includeTemplates: true

resources:
  - namespace.yaml
  - postgres.yaml
  - migrate.yaml
  - kafka.yaml
  - tracker-api.yaml
  - analytics-processor.yaml
  - frontend.yaml

# The Secret name gets a hash of its content (postgres-7f9c...), and the
# references in the manifests are rewritten to it. A new password means a
# new name, so the pods that use it are rolled out again. The migrate Job
# uses it too, and its pod template is immutable: after a password change
# delete the Job first (kubectl -n clickstream delete job migrate).
secretGenerator:
  - name: postgres
    envs:
      - postgres.secret.env

# Settings of the services, the same hash suffix: an edit of a .env file
# rolls out the pods of that service, no rollout restart needed.
configMapGenerator:
  - name: tracker-api
    envs:
      - tracker-api.env
  - name: analytics-processor
    envs:
      - analytics-processor.env
