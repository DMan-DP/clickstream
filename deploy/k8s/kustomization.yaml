# Everything for minikube in one command:
#   kubectl apply -k deploy/k8s
#   kubectl delete -k deploy/k8s
# Before the first apply: cp deploy/k8s/secrets.env.example deploy/k8s/secrets.env
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources go to this namespace, the manifests do not set their own
namespace: clickstream

labels:
  # Only metadata labels: selectors of existing workloads are immutable,
  # so a shared label must not be added to them
  - pairs:
      app.kubernetes.io/part-of: clickstream

resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml

# The Secret name gets a hash of its content (postgres-7f9c...), and the
# references in the manifests are rewritten to it. A new password means a
# new name, so the pods that use it are rolled out again.
secretGenerator:
  - name: postgres
    envs:
      - secrets.env
