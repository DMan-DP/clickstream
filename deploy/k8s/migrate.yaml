# One-shot job: applies new migrations, as the migrate service in compose.
# The image clickstream/migrate:dev has the SQL files baked in, see
# deploy/migrate/Dockerfile. Applied versions are tracked in the
# goose_db_version table, so a rerun applies only what is new.
#
# If Postgres is not ready yet, the name "postgres" does not resolve (the
# headless Service publishes only ready pods), goose fails and the Job
# retries with a growing pause, as kafka-topics does.
#
# The Job runs once and stays Completed, apply does not start it again.
# After a new migration:
#   docker compose build migrate
#   minikube image load clickstream/migrate:dev
#   kubectl -n clickstream delete job migrate
#   kubectl apply -k deploy/k8s
# The same after the Job has failed (all backoffLimit retries used).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: migrate
          image: clickstream/migrate:dev
          # The image is loaded into the node with minikube image load,
          # there is no registry to pull it from
          imagePullPolicy: IfNotPresent
          envFrom:
            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
            - secretRef:
                name: postgres
          env:
            - name: GOOSE_DRIVER
              value: postgres
            # $(VAR) is replaced by the kubelet with the value of a variable
            # defined above, here from the Secret. kubectl describe shows the
            # template with $(POSTGRES_PASSWORD), not the password.
            - name: GOOSE_DBSTRING
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: GOOSE_COMMAND
              value: up
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
